<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha TV · Vídeo</title>
    <!--
        Player do vídeo especial da Minha TV. Fica no GitHub Pages porque o YouTube recusa
        vídeos embutidos em páginas sem endereço web (erro 153), como os apps instalados na TV.
        Uso: player.html?v=<ID do vídeo com 11 caracteres>
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var id = (location.search.match(/[?&]v=([A-Za-z0-9_-]{11})(?:&|$)/) || [])[1];
        var player;

        function onYouTubeIframeAPIReady() {
            if (!id) return;
            player = new YT.Player('player', {
                videoId: id,
                playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, loop: 1, playlist: id },
                events: {
                    onReady: function(e) {
                        e.target.playVideo();
                        // TVs lentas demoram a começar: tenta de novo aos 4 s e só recomeça mudo
                        // aos 10 s, se a TV não deixar tocar com som sozinho.
                        setTimeout(function() {
                            if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
                        }, 4000);
                        setTimeout(function() {
                            if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                                player.mute();
                                player.playVideo();
                            }
                        }, 10000);
                    }
                }
            });
        }

        if (id) {
            var api = document.createElement('script');
            api.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(api);
        }
    </script>
</body>
</html>
